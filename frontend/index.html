<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:4001 http://localhost:4002 http://localhost:4003 http://localhost:4004 http://*.localhost.floci.io:4566 http://*.execute-api.localhost:4566 https://*.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Sign in · Supplier Directory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Supplier Directory &amp; Evaluation</h1>
      <p class="muted">Sign in with the account your procurement admin created for you.</p>
      <div id="notice" class="info-box" hidden></div>
      <form id="login-form" novalidate>
        <label>E-mail <input name="email" type="email" autocomplete="username" required maxlength="120"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="72"></label>
        <div id="login-error" class="error-box" hidden></div>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <p class="muted small" id="api-status">Checking services…</p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
