<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1010" viewBox="0 0 1720 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect width="1720" height="1010" fill="#ffffff"/>
  <text x="860" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Supplier Directory &amp; Evaluation System - cloud architecture (Floci / AWS)</text>
  <text x="860" y="58" text-anchor="middle" font-size="14" fill="#475569">Each service is deployed on its own: API Gateway HTTP API -> Lambda -> own IAM role, own secret, own database role and schema</text>

  <!-- users -->
  <rect x="30" y="100" width="220" height="120" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  <text x="140" y="128" text-anchor="middle" font-size="16" font-weight="700">Users (browser)</text>
  <text x="140" y="152" text-anchor="middle" font-size="13">Admin - Procurement Manager</text>
  <text x="140" y="172" text-anchor="middle" font-size="13">Staff - Evaluator / receiving</text>
  <text x="140" y="198" text-anchor="middle" font-size="12" fill="#475569">JWT kept in sessionStorage</text>

  <!-- Floci boundary -->
  <rect x="280" y="80" width="1160" height="635" rx="16" fill="#f8fafc" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="106" font-size="15" font-weight="700" fill="#0f766e">Floci - local AWS emulator (account 000000000000, us-east-1). The same scripts and commands deploy to real AWS.</text>

  <!-- S3 -->
  <rect x="300" y="122" width="330" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="465" y="146" text-anchor="middle" font-size="15" font-weight="700">Amazon S3 - bucket ses-web (presentation)</text>
  <text x="465" y="168" text-anchor="middle" font-size="12.5">Static website: index, dashboard, suppliers,</text>
  <text x="465" y="187" text-anchor="middle" font-size="12.5">orders, evaluations, admin pages, CSS, JS,</text>
  <text x="465" y="204" text-anchor="middle" font-size="12.5">config.js (API URLs only, no secrets)</text>
  <line x1="250" y1="150" x2="298" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="652" y="150" font-size="12.5" fill="#334155">1. browser downloads the pages from S3</text>
  <text x="652" y="170" font-size="12.5" fill="#334155">2. app JS calls the APIs with fetch(): JSON + Bearer JWT</text>
  <text x="652" y="190" font-size="12.5" fill="#334155">3. CORS allows only the website origin; HTTPS on real AWS</text>

  <!-- browser to APIs -->
  <path d="M140,220 L140,240 L1265,240" fill="none" stroke="#334155" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2" marker-end="url(#a)">
    <line x1="425" y1="240" x2="425" y2="268"/><line x1="705" y1="240" x2="705" y2="268"/>
    <line x1="985" y1="240" x2="985" y2="268"/><line x1="1265" y1="240" x2="1265" y2="268"/>
  </g>
  <text x="300" y="233" font-size="12" fill="#334155">API layer: 4 x Amazon API Gateway HTTP API ($default stage, throttling 20 req/s, burst 50). Only listed routes are published; /internal/* never is.</text>

  <g font-size="12.5">
    <rect x="300" y="270" width="250" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="425" y="291" text-anchor="middle" font-weight="700">ses-auth-service-api</text>
    <text x="425" y="310" text-anchor="middle">/api/auth/*, /api/users, /api/admin/*</text>
    <rect x="300" y="342" width="250" height="128" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="425" y="364" text-anchor="middle" font-weight="700" font-size="14">Lambda ses-auth-service</text>
    <text x="425" y="384" text-anchor="middle">login, logout, me, Staff accounts,</text>
    <text x="425" y="402" text-anchor="middle">lock-out, security activity monitor</text>
    <text x="425" y="422" text-anchor="middle" fill="#7c3aed" font-weight="700">Shared - lead: Zeyad</text>
    <text x="425" y="444" text-anchor="middle" font-size="11.5" fill="#475569">IAM role ses-auth-service-role</text>
    <text x="425" y="461" text-anchor="middle" font-size="11.5" fill="#7c3aed">DB role auth_svc -> schemas auth, audit</text>

    <rect x="580" y="270" width="250" height="52" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="705" y="291" text-anchor="middle" font-weight="700">ses-supplier-service-api</text>
    <text x="705" y="310" text-anchor="middle">/api/suppliers, /api/contracts, ...</text>
    <rect x="580" y="342" width="250" height="128" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="705" y="364" text-anchor="middle" font-weight="700" font-size="14">Lambda ses-supplier-service</text>
    <text x="705" y="384" text-anchor="middle">directory, contracts, status workflow,</text>
    <text x="705" y="402" text-anchor="middle">recommendations, eligibility</text>
    <text x="705" y="422" text-anchor="middle" fill="#15803d" font-weight="700">Owner: Zeyad</text>
    <text x="705" y="444" text-anchor="middle" font-size="11.5" fill="#475569">IAM role ses-supplier-service-role</text>
    <text x="705" y="461" text-anchor="middle" font-size="11.5" fill="#15803d">DB role supplier_svc -> schema supplier</text>

    <rect x="860" y="270" width="250" height="52" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="985" y="291" text-anchor="middle" font-weight="700">ses-order-service-api</text>
    <text x="985" y="310" text-anchor="middle">/api/orders, /api/orders/{id}/...</text>
    <rect x="860" y="342" width="250" height="128" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="985" y="364" text-anchor="middle" font-weight="700" font-size="14">Lambda ses-order-service</text>
    <text x="985" y="384" text-anchor="middle">purchase orders, approval, delivery</text>
    <text x="985" y="402" text-anchor="middle">workflow, limits, spending summary</text>
    <text x="985" y="422" text-anchor="middle" fill="#b45309" font-weight="700">Owner: Ebraheem</text>
    <text x="985" y="444" text-anchor="middle" font-size="11.5" fill="#475569">IAM role ses-order-service-role</text>
    <text x="985" y="461" text-anchor="middle" font-size="11.5" fill="#b45309">DB role order_svc -> schema orders</text>

    <rect x="1140" y="270" width="250" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1265" y="291" text-anchor="middle" font-weight="700">ses-evaluation-service-api</text>
    <text x="1265" y="310" text-anchor="middle">/api/evaluations, /performance, /rates</text>
    <rect x="1140" y="342" width="250" height="128" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="1265" y="364" text-anchor="middle" font-weight="700" font-size="14">Lambda ses-evaluation-service</text>
    <text x="1265" y="384" text-anchor="middle">ratings, scores, reports, compare,</text>
    <text x="1265" y="402" text-anchor="middle">EGP conversion</text>
    <text x="1265" y="422" text-anchor="middle" fill="#b91c1c" font-weight="700">Owner: Karim</text>
    <text x="1265" y="444" text-anchor="middle" font-size="11.5" fill="#475569">IAM role ses-evaluation-service-role</text>
    <text x="1265" y="461" text-anchor="middle" font-size="11.5" fill="#b91c1c">DB role evaluation_svc -> schema evaluation</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#a)">
    <line x1="425" y1="322" x2="425" y2="340"/><line x1="705" y1="322" x2="705" y2="340"/>
    <line x1="985" y1="322" x2="985" y2="340"/><line x1="1265" y1="322" x2="1265" y2="340"/>
  </g>

  <!-- internal calls panel -->
  <rect x="580" y="490" width="810" height="120" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <text x="595" y="512" font-size="13.5" font-weight="700" fill="#b45309">Service-to-service calls: lambda:InvokeFunction (allowed per IAM role) + 60-second service token (audience = target)</text>
  <g font-size="12.5" fill="#7c2d12">
    <text x="600" y="536">Order -> Supplier: is the supplier ACTIVE with a contract valid on the order date?</text>
    <text x="600" y="556">Order -> Evaluation: convert the order value to EGP (and record it)</text>
    <text x="600" y="576">Evaluation -> Order: is the order DELIVERED and raised by this user?</text>
    <text x="600" y="596">Evaluation -> Supplier: new average score (may set UNDER_REVIEW)</text>
    <text x="1080" y="536">Supplier -> Order: open orders?</text>
    <text x="1080" y="556">   (archive is refused if any)</text>
    <text x="1080" y="576">Supplier -> Evaluation: contract</text>
    <text x="1080" y="596">   value in EGP</text>
  </g>
  <g stroke="#b45309" stroke-width="2" marker-end="url(#o)">
    <line x1="705" y1="470" x2="705" y2="488"/><line x1="985" y1="470" x2="985" y2="488"/><line x1="1265" y1="470" x2="1265" y2="488"/>
  </g>

  <!-- supporting services -->
  <rect x="300" y="630" width="340" height="72" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="470" y="653" text-anchor="middle" font-size="14" font-weight="700">AWS Secrets Manager</text>
  <text x="470" y="672" text-anchor="middle" font-size="12">ses/&lt;service&gt;: DATABASE_URL, JWT secrets, API key</text>
  <text x="470" y="690" text-anchor="middle" font-size="12">read once per cold start; each role reads its own only</text>
  <rect x="660" y="630" width="300" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="810" y="653" text-anchor="middle" font-size="14" font-weight="700">AWS IAM (least privilege)</text>
  <text x="810" y="672" text-anchor="middle" font-size="12">1 role per Lambda: own logs, own secret,</text>
  <text x="810" y="690" text-anchor="middle" font-size="12">invoke only the functions it needs</text>
  <rect x="980" y="630" width="440" height="72" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="1200" y="653" text-anchor="middle" font-size="14" font-weight="700">Amazon CloudWatch Logs, Metrics and Alarms</text>
  <text x="1200" y="672" text-anchor="middle" font-size="12">/aws/lambda/ses-* JSON logs (14 days); metric filters FailedLogins,</text>
  <text x="1200" y="690" text-anchor="middle" font-size="12">Http401/403/5xx, ExchangeApiFailures; 3 alarms</text>

  <!-- data layer -->
  <line x1="860" y1="715" x2="860" y2="758" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="872" y="742" font-size="12.5" fill="#334155">each Lambda connects with ITS OWN database role (parameterised SQL; TLS when the DB is Neon)</text>
  <rect x="280" y="760" width="1160" height="225" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="300" y="786" font-size="16" font-weight="700">Data layer: PostgreSQL 16 - container ses-postgres on the Floci Docker network (or Neon) - database supplierdb</text>
  <g font-size="12.5">
    <rect x="300" y="802" width="260" height="165" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="430" y="824" text-anchor="middle" font-weight="700">schema auth</text>
    <text x="430" y="844" text-anchor="middle">users, sessions</text>
    <text x="430" y="872" text-anchor="middle" font-weight="700">schema audit</text>
    <text x="430" y="892" text-anchor="middle">activity_log (services: INSERT only)</text>
    <text x="430" y="950" text-anchor="middle" fill="#7c3aed" font-weight="700">role auth_svc</text>
    <rect x="580" y="802" width="260" height="165" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="710" y="824" text-anchor="middle" font-weight="700">schema supplier</text>
    <text x="710" y="844" text-anchor="middle">categories, suppliers,</text>
    <text x="710" y="862" text-anchor="middle">supplier_contacts, contracts,</text>
    <text x="710" y="880" text-anchor="middle">status_history</text>
    <text x="710" y="950" text-anchor="middle" fill="#15803d" font-weight="700">role supplier_svc</text>
    <rect x="860" y="802" width="260" height="165" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="990" y="824" text-anchor="middle" font-weight="700">schema orders</text>
    <text x="990" y="844" text-anchor="middle">purchase_orders,</text>
    <text x="990" y="862" text-anchor="middle">order_status_history</text>
    <text x="990" y="950" text-anchor="middle" fill="#b45309" font-weight="700">role order_svc</text>
    <rect x="1140" y="802" width="280" height="165" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1280" y="824" text-anchor="middle" font-weight="700">schema evaluation</text>
    <text x="1280" y="844" text-anchor="middle">evaluations, price_conversions,</text>
    <text x="1280" y="862" text-anchor="middle">rate_cache</text>
    <text x="1280" y="950" text-anchor="middle" fill="#b91c1c" font-weight="700">role evaluation_svc</text>
  </g>
  <text x="300" y="1002" font-size="11.5" fill="#475569">A role has no rights on other schemas (verified: order_svc reading supplier.suppliers -> permission denied). Cross-service data always goes through the owning service's API.</text>

  <!-- external API -->
  <rect x="1480" y="340" width="220" height="132" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="1590" y="366" text-anchor="middle" font-size="15" font-weight="700">External API</text>
  <text x="1590" y="388" text-anchor="middle" font-size="13">ExchangeRate-API</text>
  <text x="1590" y="408" text-anchor="middle" font-size="11.5">GET /v6/latest/EGP (HTTPS)</text>
  <text x="1590" y="426" text-anchor="middle" font-size="11.5">key in Secrets Manager</text>
  <text x="1590" y="444" text-anchor="middle" font-size="11.5">cached 6 h, 5 s timeout,</text>
  <text x="1590" y="462" text-anchor="middle" font-size="11.5">response validated</text>
  <line x1="1390" y1="405" x2="1478" y2="405" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#y)"/>
  <text x="1398" y="397" font-size="11.5" fill="#ca8a04">HTTPS</text>
</svg>
